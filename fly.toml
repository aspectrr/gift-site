# fly launch --no-deploy  (once, to create the app + pick a name)
# fly volumes create data --size 1
# fly secrets set APP_SECRET=$(openssl rand -hex 32) APP_URL=https://<your-app>.fly.dev RESEND_API_KEY=... [RESEND_FROM=...]
# fly deploy

app = "family-favorites"
primary_region = "ord"

[env]
  PORT = "3000"

[build]

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # keep one machine always up so the reminder timer keeps ticking
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    path = "/"
