# fly.toml app configuration file generated for gift-site on 2026-11-09T18:53:25Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'gift-site'
primary_region = 'ord'

[build]
[env]
  PORT = '3000'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    path = '/'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
