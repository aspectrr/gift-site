name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # native `bun lint` ships in Bun canary; unpin once it lands in stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4-canary.1
      - run: bun install --frozen-lockfile
      - run: bun fmt --check
      - run: bun lint src
      - run: bun run typecheck
      - run: bun test

  docker:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t gift-site-ci .
